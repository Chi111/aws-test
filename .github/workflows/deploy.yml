name: Deploy MVP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      STACK_NAME: ${{ vars.STACK_NAME || 'github-profile-sam-dev' }}
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      ENABLE_SYNTHETICS: ${{ vars.ENABLE_SYNTHETICS || 'false' }}
      SYNTHETICS_CANARY_NAME: ${{ vars.SYNTHETICS_CANARY_NAME || 'gh-profile-api-dev' }}
      SYNTHETICS_SCHEDULE_EXPRESSION: ${{ vars.SYNTHETICS_SCHEDULE_EXPRESSION || 'rate(5 minutes)' }}
      SYNTHETICS_RUNTIME_VERSION: ${{ vars.SYNTHETICS_RUNTIME_VERSION || 'syn-nodejs-puppeteer-16.1' }}
      ENABLE_AIOPS: ${{ vars.ENABLE_AIOPS || 'false' }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID || 'us.amazon.nova-lite-v1:0' }}
      AIOPS_NOTIFICATION_EMAIL: ${{ vars.AIOPS_NOTIFICATION_EMAIL }}
      ENABLE_PERFORMANCE_LOG_WORKER: ${{ vars.ENABLE_PERFORMANCE_LOG_WORKER || 'false' }}
      PERFORMANCE_WORKER_ECR_REPOSITORY: ${{ vars.PERFORMANCE_WORKER_ECR_REPOSITORY || 'github-profile-sam-performance-worker' }}
      PERFORMANCE_WORKER_IMAGE_URI: ""
      VITE_PERFORMANCE_ENABLED: ${{ vars.VITE_PERFORMANCE_ENABLED || vars.ENABLE_PERFORMANCE_LOG_WORKER || 'false' }}
      VITE_PERFORMANCE_APP_ID: ${{ vars.VITE_PERFORMANCE_APP_ID || 'github-profile-web' }}
      VITE_RELEASE_VERSION: ${{ github.sha }}
      VITE_APP_ENV: production
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check-types
      - run: pnpm build

      - uses: docker/setup-buildx-action@v3
        if: env.ENABLE_PERFORMANCE_LOG_WORKER == 'true'

      - name: Build and push performance log worker
        if: env.ENABLE_PERFORMANCE_LOG_WORKER == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          if ! aws ecr describe-repositories --repository-names "$PERFORMANCE_WORKER_ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$PERFORMANCE_WORKER_ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true
          fi
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"
          PERFORMANCE_WORKER_IMAGE_URI="${REGISTRY}/${PERFORMANCE_WORKER_ECR_REPOSITORY}:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file apps/server/Dockerfile.performance-worker \
            --tag "$PERFORMANCE_WORKER_IMAGE_URI" \
            --push \
            .
          echo "PERFORMANCE_WORKER_IMAGE_URI=$PERFORMANCE_WORKER_IMAGE_URI" >> "$GITHUB_ENV"

      - uses: aws-actions/setup-sam@v2

      - name: Validate SAM templates
        run: |
          sam validate --lint --template-file infra/sam/template.yaml
          sam validate --lint --template-file infra/sam/aiops-template.yaml

      - name: SAM build
        run: sam build --template-file infra/sam/template.yaml

      - name: SAM build AIOps
        run: sam build --template-file infra/sam/aiops-template.yaml --build-dir .aws-sam-aiops/build

      - name: Prepare SAM artifact bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          SAM_ARTIFACT_BUCKET="${{ vars.SAM_ARTIFACT_BUCKET }}"
          if [ -z "$SAM_ARTIFACT_BUCKET" ]; then
            SAM_ARTIFACT_BUCKET="${STACK_NAME}-artifacts-${ACCOUNT_ID}-${AWS_REGION}"
          fi
          echo "SAM_ARTIFACT_BUCKET=$SAM_ARTIFACT_BUCKET" >> "$GITHUB_ENV"

          if ! aws s3api head-bucket --bucket "$SAM_ARTIFACT_BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$SAM_ARTIFACT_BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$SAM_ARTIFACT_BUCKET" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
          fi

      - name: Remove failed CloudFormation stack shell
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || true)
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
          fi

      - name: SAM deploy
        run: >
          sam deploy
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --capabilities CAPABILITY_IAM
          --s3-bucket "$SAM_ARTIFACT_BUCKET"
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          ProjectName=${{ vars.PROJECT_NAME || 'github-profile-sam-dev' }}
          DatabaseUrl=${{ secrets.DATABASE_URL }}
          JwtSecret=${{ secrets.JWT_SECRET }}
          CorsOrigin=${{ vars.CORS_ORIGIN }}
          VpcId=${{ vars.VPC_ID }}
          PrivateSubnetIds=${{ vars.PRIVATE_SUBNET_IDS }}
          AuroraSecurityGroupId=${{ vars.AURORA_SECURITY_GROUP_ID }}
          ReleaseVersion="$GITHUB_SHA"
          EnableSynthetics="$ENABLE_SYNTHETICS"
          SyntheticsCanaryName="$SYNTHETICS_CANARY_NAME"
          SyntheticsScheduleExpression="'$SYNTHETICS_SCHEDULE_EXPRESSION'"
          SyntheticsRuntimeVersion="$SYNTHETICS_RUNTIME_VERSION"
          EnableCloudMapIntegration=${{ vars.ENABLE_CLOUD_MAP_INTEGRATION || 'false' }}
          CloudMapNamespaceName=${{ vars.CLOUD_MAP_NAMESPACE_NAME || 'internal.github-profile' }}
          GoServiceSecurityGroupId=${{ vars.GO_SERVICE_SECURITY_GROUP_ID || '' }}
          EnableManagedVpcNetworking=${{ vars.ENABLE_MANAGED_VPC_NETWORKING || 'false' }}
          InternetGatewayId=${{ vars.INTERNET_GATEWAY_ID || '' }}
          ManagedPublicSubnetCidr=${{ vars.MANAGED_PUBLIC_SUBNET_CIDR || '172.31.240.0/24' }}
          ManagedPrivateSubnet1Cidr=${{ vars.MANAGED_PRIVATE_SUBNET_1_CIDR || '172.31.241.0/24' }}
          ManagedPrivateSubnet2Cidr=${{ vars.MANAGED_PRIVATE_SUBNET_2_CIDR || '172.31.242.0/24' }}
          ManagedPublicSubnetAz=${{ vars.MANAGED_PUBLIC_SUBNET_AZ || 'us-east-2a' }}
          ManagedPrivateSubnet1Az=${{ vars.MANAGED_PRIVATE_SUBNET_1_AZ || 'us-east-2b' }}
          ManagedPrivateSubnet2Az=${{ vars.MANAGED_PRIVATE_SUBNET_2_AZ || 'us-east-2c' }}
          EnablePerformanceLogWorker="$ENABLE_PERFORMANCE_LOG_WORKER"
          PerformanceWorkerImageUri="$PERFORMANCE_WORKER_IMAGE_URI"
          PerformanceHashSecret="${{ secrets.PERFORMANCE_HASH_SECRET }}"
          PerformanceWorkerDesiredCount=${{ vars.PERFORMANCE_WORKER_DESIRED_COUNT || '1' }}
          PerformanceWorkerPollIntervalMs=${{ vars.PERFORMANCE_WORKER_POLL_INTERVAL_MS || '5000' }}
          PerformanceWorkerBatchSize=${{ vars.PERFORMANCE_WORKER_BATCH_SIZE || '100' }}
          PerformanceWorkerLogRetentionDays=${{ vars.PERFORMANCE_WORKER_LOG_RETENTION_DAYS || '30' }}
          PerformanceRawRetentionDays=${{ vars.PERFORMANCE_RAW_RETENTION_DAYS || '7' }}
          PerformanceCleanRetentionDays=${{ vars.PERFORMANCE_CLEAN_RETENTION_DAYS || '90' }}
          PerformanceIngestBurstLimit=${{ vars.PERFORMANCE_INGEST_BURST_LIMIT || '10' }}
          PerformanceIngestRateLimit=${{ vars.PERFORMANCE_INGEST_RATE_LIMIT || '5' }}

      - name: Run database setup inside VPC
        run: |
          SETUP_FUNCTION=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='SetupFunctionName'].OutputValue" \
            --output text)
          INVOKE_ERROR=$(aws lambda invoke \
            --function-name "$SETUP_FUNCTION" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            --query FunctionError \
            --output text \
            setup-output.json)
          cat setup-output.json
          if [ "$INVOKE_ERROR" != "None" ]; then
            exit 1
          fi

      - name: Deploy read-only AIOps stack
        if: env.ENABLE_AIOPS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AIOPS_STACK_NAME="${STACK_NAME}-aiops"
          AIOPS_STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$AIOPS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || true)
          if [ "$AIOPS_STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack --stack-name "$AIOPS_STACK_NAME" --region "$AWS_REGION"
            aws cloudformation wait stack-delete-complete --stack-name "$AIOPS_STACK_NAME" --region "$AWS_REGION"
          fi

          PROFILE_QUEUE_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ProfileEventsQueueUrl'].OutputValue" \
            --output text)
          PROFILE_DLQ_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ProfileEventsDeadLetterQueueUrl'].OutputValue" \
            --output text)

          sam deploy \
            --template-file .aws-sam-aiops/build/template.yaml \
            --stack-name "$AIOPS_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --s3-bucket "$SAM_ARTIFACT_BUCKET" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ProjectName="${{ vars.PROJECT_NAME || 'github-profile-sam-dev' }}" \
              BedrockModelId="$BEDROCK_MODEL_ID" \
              NotificationEmail="$AIOPS_NOTIFICATION_EMAIL" \
              SyntheticsAlarmPrefix="Synthetics-Alarm-${SYNTHETICS_CANARY_NAME}" \
              SqsQueueUrls="$PROFILE_QUEUE_URL,$PROFILE_DLQ_URL"

      - name: Upload web assets
        run: |
          WEB_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='WebBucketName'].OutputValue" \
            --output text)
          aws s3 sync apps/web/dist "s3://$WEB_BUCKET" --delete

      - name: Deploy production Cloudflare Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_WORKER_NAME"
          npx --yes wrangler@4.111.0 deploy --name "$CLOUDFLARE_WORKER_NAME"
