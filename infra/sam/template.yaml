AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GitHub Profile Admin MVP using Hono Lambda, S3 web hosting, and an existing Aurora PostgreSQL database.

Parameters:
  ProjectName:
    Type: String
    Default: github-profile-sam-dev
    AllowedPattern: "^[a-z0-9-]+$"
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string for the existing Aurora dev database.
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret used to sign the admin session cookie.
  CorsOrigin:
    Type: String
    Default: "http://localhost:3001"
    Description: Frontend origin allowed by the API.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC containing Aurora.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Existing private subnets for Lambda.
  AuroraSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing Aurora security group that should allow Lambda on port 5432.
  ReleaseVersion:
    Type: String
    Default: local
    AllowedPattern: "^[A-Za-z0-9._-]+$"
    Description: Release identifier returned by the health endpoint for canary verification.
  EnableSynthetics:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create and start a CloudWatch Synthetics API health canary.
  SyntheticsCanaryName:
    Type: String
    Default: gh-profile-api-dev
    AllowedPattern: "^[0-9A-Za-z_-]{1,21}$"
    Description: Globally visible canary name. CloudWatch Synthetics limits names to 21 characters.
  SyntheticsScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    Description: CloudWatch Synthetics schedule. Use rate(1 minute) temporarily for assignment evidence.
  SyntheticsRuntimeVersion:
    Type: String
    Default: syn-nodejs-puppeteer-16.1
    Description: Supported CloudWatch Synthetics Puppeteer runtime version.
  EnableCloudMapIntegration:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create private Cloud Map DNS resources and allow Lambda to call the Go ECS service.
  CloudMapNamespaceName:
    Type: String
    Default: internal.github-profile
    AllowedPattern: "^[a-z0-9.-]+$"
    Description: Private DNS namespace used inside the VPC.
  GoServiceSecurityGroupId:
    Type: String
    Default: ""
    Description: Existing ECS Go service security group. Required when Cloud Map integration is enabled.
  EnableManagedVpcNetworking:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create one public subnet, two private subnets, NAT, and route tables in the existing VPC for Lambda.
  InternetGatewayId:
    Type: String
    Default: ""
    Description: Existing VPC Internet Gateway ID. Required when EnableManagedVpcNetworking is true.
  ManagedPublicSubnetCidr:
    Type: String
    Default: 172.31.240.0/24
    Description: CIDR for the SAM-managed public subnet.
  ManagedPrivateSubnet1Cidr:
    Type: String
    Default: 172.31.241.0/24
    Description: CIDR for the first SAM-managed private Lambda subnet.
  ManagedPrivateSubnet2Cidr:
    Type: String
    Default: 172.31.242.0/24
    Description: CIDR for the second SAM-managed private Lambda subnet.
  ManagedPublicSubnetAz:
    Type: String
    Default: us-east-2a
    Description: Availability Zone for the SAM-managed public subnet.
  ManagedPrivateSubnet1Az:
    Type: String
    Default: us-east-2b
    Description: Availability Zone for the first SAM-managed private subnet.
  ManagedPrivateSubnet2Az:
    Type: String
    Default: us-east-2c
    Description: Availability Zone for the second SAM-managed private subnet.

Rules:
  RequireGoServiceSecurityGroupForCloudMap:
    RuleCondition: !Equals [!Ref EnableCloudMapIntegration, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref GoServiceSecurityGroupId, ""]]
        AssertDescription: GoServiceSecurityGroupId is required when Cloud Map integration is enabled.

Conditions:
  CreateManagedVpcNetworking: !Equals [!Ref EnableManagedVpcNetworking, "true"]
  CreateCloudMapIntegration: !Equals [!Ref EnableCloudMapIntegration, "true"]
  CreateSynthetics: !Equals [!Ref EnableSynthetics, "true"]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 20
    MemorySize: 512

Resources:
  ApiHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowCredentials: true
        AllowHeaders:
          - content-type
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowOrigins:
          - !Ref CorsOrigin

  ProfileEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-profile-events"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ProfileEventsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-profile-events-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ProfileEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-profile-events"
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProfileEventsDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ProfileEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProfileEventsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOnlyProfileEventsTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ProfileEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref ProfileEventsTopic

  ProfileEventsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: ProfileEventsQueuePolicy
    Properties:
      TopicArn: !Ref ProfileEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt ProfileEventsQueue.Arn
      RawMessageDelivery: true

  ProfileEventWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-profile-event-worker"
      Description: Validates and processes profile.updated events from SQS.
      CodeUri: ../../apps/server/dist
      Handler: profile-event-worker.handler
      Timeout: 20
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSPollerPolicy:
            QueueName: !GetAtt ProfileEventsQueue.QueueName
      Events:
        ProfileEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt ProfileEventsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  ProfileEventOutboxPublisher:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-profile-event-outbox-publisher"
      Description: Claims committed PostgreSQL outbox rows and publishes them to the profile events SNS topic.
      CodeUri: ../../apps/server/dist
      Handler: profile-event-outbox-publisher.handler
      Timeout: 60
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          NODE_ENV: production
          DATABASE_URL: !Ref DatabaseUrl
          PROFILE_EVENTS_TOPIC_ARN: !Ref ProfileEventsTopic
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !If
          - CreateManagedVpcNetworking
          - - !Ref ManagedPrivateSubnet1
            - !Ref ManagedPrivateSubnet2
          - !Ref PrivateSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Sid: PublishCommittedProfileEvents
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref ProfileEventsTopic
      Events:
        PublishPendingOutboxEvents:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-api-server-errors"
      AlarmDescription: Roll back a canary release when the API emits a server-error response metric.
      Namespace: GitHubProfileSam
      MetricName: Api5xxCount
      Dimensions:
        - Name: Service
          Value: !Ref ProjectName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiLambdaInvocationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-api-lambda-errors"
      AlarmDescription: Roll back a canary release on API Lambda crashes, timeouts, or unhandled invocation errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SyntheticsArtifactsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateSynthetics
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCanaryArtifacts
            Status: Enabled
            ExpirationInDays: 31
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SyntheticsCanaryRole:
    Type: AWS::IAM::Role
    Condition: CreateSynthetics
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteCanaryTelemetry
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt SyntheticsArtifactsBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${SyntheticsArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: "*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CloudWatchSynthetics
              - Effect: Allow
                Action: xray:PutTraceSegments
                Resource: "*"
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*:*"

  ApiHealthCanary:
    Type: AWS::Synthetics::Canary
    Condition: CreateSynthetics
    DependsOn: ApiFunction
    Properties:
      Name: !Ref SyntheticsCanaryName
      ArtifactS3Location: !Sub "s3://${SyntheticsArtifactsBucket}/"
      ExecutionRoleArn: !GetAtt SyntheticsCanaryRole.Arn
      RuntimeVersion: !Ref SyntheticsRuntimeVersion
      StartCanaryAfterCreation: true
      SuccessRetentionPeriod: 31
      FailureRetentionPeriod: 31
      Schedule:
        Expression: !Ref SyntheticsScheduleExpression
        DurationInSeconds: 0
      RunConfig:
        TimeoutInSeconds: 60
        EnvironmentVariables:
          TARGET_URL: !Sub "https://${ApiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
      Code:
        Handler: apiCanary.handler
        Script: |
          const synthetics = require('@aws/synthetics-puppeteer');

          async function readBody(response) {
            return await new Promise((resolve, reject) => {
              const chunks = [];
              response.on('data', (chunk) => chunks.push(Buffer.from(chunk)));
              response.on('end', () => resolve(Buffer.concat(chunks).toString('utf8')));
              response.on('error', reject);
            });
          }

          async function apiCanary() {
            const target = new URL(process.env.TARGET_URL);
            const request = {
              protocol: target.protocol,
              hostname: target.hostname,
              port: target.port ? Number(target.port) : 443,
              method: 'GET',
              path: `${target.pathname}${target.search}`,
              headers: {
                accept: 'application/json',
                'user-agent': synthetics.getCanaryUserAgentString()
              }
            };

            await synthetics.executeHttpStep('api-health', request, async (response) => {
              const body = await readBody(response);
              if (response.statusCode !== 200) {
                throw new Error(`Expected HTTP 200, received ${response.statusCode}: ${body}`);
              }
              const payload = JSON.parse(body);
              if (payload.status !== 'ok' || payload.service !== 'github-profile-sam' || !payload.version) {
                throw new Error(`Unexpected health response: ${body}`);
              }
            });
          }

          exports.handler = async () => apiCanary();

  ApiHealthCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateSynthetics
    Properties:
      AlarmName: !Sub "Synthetics-Alarm-${SyntheticsCanaryName}-1"
      AlarmDescription: The public API health canary failed or stopped reporting.
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Ref ApiHealthCanary
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 100
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} Lambda egress security group"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  CloudMapNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Condition: CreateCloudMapIntegration
    Properties:
      Name: !Ref CloudMapNamespaceName
      Description: Private service discovery namespace for GitHub Profile workloads.
      Vpc: !Ref VpcId
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GoServiceDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Condition: CreateCloudMapIntegration
    Properties:
      Name: go
      Description: Private DNS records automatically registered by the ECS Go service.
      NamespaceId: !Ref CloudMapNamespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GoServiceIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateCloudMapIntegration
    Properties:
      GroupId: !Ref GoServiceSecurityGroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Allow Lambda to call the Go service through its private task IP.

  ManagedPublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateManagedVpcNetworking
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref ManagedPublicSubnetCidr
      AvailabilityZone: !Ref ManagedPublicSubnetAz
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-subnet"

  ManagedPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateManagedVpcNetworking
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref ManagedPrivateSubnet1Cidr
      AvailabilityZone: !Ref ManagedPrivateSubnet1Az
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-subnet-1"

  ManagedPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateManagedVpcNetworking
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref ManagedPrivateSubnet2Cidr
      AvailabilityZone: !Ref ManagedPrivateSubnet2Az
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-subnet-2"

  ManagedPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateManagedVpcNetworking
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-rt"

  ManagedPublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateManagedVpcNetworking
    DependsOn:
      - ManagedPublicSubnet
    Properties:
      RouteTableId: !Ref ManagedPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayId

  ManagedPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateManagedVpcNetworking
    Properties:
      SubnetId: !Ref ManagedPublicSubnet
      RouteTableId: !Ref ManagedPublicRouteTable

  ManagedNatEip:
    Type: AWS::EC2::EIP
    Condition: CreateManagedVpcNetworking
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat-eip"

  ManagedNatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateManagedVpcNetworking
    DependsOn:
      - ManagedPublicDefaultRoute
    Properties:
      AllocationId: !GetAtt ManagedNatEip.AllocationId
      SubnetId: !Ref ManagedPublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat"

  ManagedPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateManagedVpcNetworking
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-rt"

  ManagedPrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateManagedVpcNetworking
    Properties:
      RouteTableId: !Ref ManagedPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref ManagedNatGateway

  ManagedPrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateManagedVpcNetworking
    Properties:
      SubnetId: !Ref ManagedPrivateSubnet1
      RouteTableId: !Ref ManagedPrivateRouteTable

  ManagedPrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateManagedVpcNetworking
    Properties:
      SubnetId: !Ref ManagedPrivateSubnet2
      RouteTableId: !Ref ManagedPrivateRouteTable

  AuroraIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AuroraSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Allow MVP Lambda to connect to existing Aurora PostgreSQL.

  AuroraIngressFromGoService:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateCloudMapIntegration
    Properties:
      GroupId: !Ref AuroraSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref GoServiceSecurityGroupId
      Description: Allow the private ECS Go service to connect to Aurora PostgreSQL.

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      CodeUri: ../../apps/server/dist
      Handler: lambda.handler
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DeploymentPreference:
        Type: Canary10Percent10Minutes
        Alarms:
          - !Ref ApiServerErrorAlarm
          - !Ref ApiLambdaInvocationErrorAlarm
      Environment:
        Variables:
          NODE_ENV: production
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          CORS_ORIGIN: !Ref CorsOrigin
          RELEASE_VERSION: !Ref ReleaseVersion
          METRIC_SERVICE_NAME: !Ref ProjectName
          GO_SERVICE_BASE_URL: !If
            - CreateCloudMapIntegration
            - !Sub "http://go.${CloudMapNamespaceName}:8080"
            - ""
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !If
          - CreateManagedVpcNetworking
          - - !Ref ManagedPrivateSubnet1
            - !Ref ManagedPrivateSubnet2
          - !Ref PrivateSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiHttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiHttpApi
            Path: /
            Method: ANY

  SetupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-setup"
      CodeUri: ../../apps/server/dist
      Handler: setup.handler
      Description: Runs idempotent MVP database setup inside the VPC.
      Timeout: 60
      Environment:
        Variables:
          NODE_ENV: production
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          CORS_ORIGIN: !Ref CorsOrigin
          GO_SERVICE_BASE_URL: ""
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !If
          - CreateManagedVpcNetworking
          - - !Ref ManagedPrivateSubnet1
            - !Ref ManagedPrivateSubnet2
          - !Ref PrivateSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Sid: ManageOnlyPreviewDatabaseSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:github-profile/pr-database-url-*"

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-web-${AWS::AccountId}-${AWS::Region}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPublicReadForDevMvp
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"

Outputs:
  ApiUrl:
    Description: HTTP API endpoint.
    Value: !Sub "https://${ApiHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  WebBucketName:
    Description: S3 bucket for built frontend assets.
    Value: !Ref WebBucket
  WebUrl:
    Description: S3 website URL for the dev MVP frontend.
    Value: !Sub "http://${WebBucket}.s3-website.${AWS::Region}.amazonaws.com"
  SetupFunctionName:
    Description: Lambda function that performs VPC-internal database setup.
    Value: !Ref SetupFunction
  ApiLiveAliasArn:
    Description: Lambda live alias used by CodeDeploy for canary traffic shifting.
    Value: !Sub "${ApiFunction.Arn}:live"
  ProfileEventsTopicArn:
    Description: SNS topic that receives profile.updated events.
    Value: !Ref ProfileEventsTopic
  ProfileEventsQueueUrl:
    Description: SQS queue consumed by the profile event worker.
    Value: !Ref ProfileEventsQueue
  ProfileEventsDeadLetterQueueUrl:
    Description: SQS dead-letter queue for profile events that fail processing three times.
    Value: !Ref ProfileEventsDeadLetterQueue
  ProfileEventWorkerName:
    Description: Lambda function that consumes profile events from SQS.
    Value: !Ref ProfileEventWorker
  ProfileEventOutboxPublisherName:
    Description: Scheduled Lambda that publishes committed PostgreSQL outbox rows to SNS.
    Value: !Ref ProfileEventOutboxPublisher
  SyntheticsCanary:
    Condition: CreateSynthetics
    Description: CloudWatch Synthetics canary monitoring the public API health endpoint.
    Value: !Ref ApiHealthCanary
  ManagedPublicSubnetId:
    Condition: CreateManagedVpcNetworking
    Description: SAM-managed public subnet for NAT.
    Value: !Ref ManagedPublicSubnet
  ManagedPrivateSubnetIds:
    Condition: CreateManagedVpcNetworking
    Description: SAM-managed private subnets used by Lambda.
    Value: !Join [",", [!Ref ManagedPrivateSubnet1, !Ref ManagedPrivateSubnet2]]
  ManagedNatGatewayId:
    Condition: CreateManagedVpcNetworking
    Description: SAM-managed NAT gateway for Lambda outbound internet access.
    Value: !Ref ManagedNatGateway
  CloudMapNamespaceId:
    Condition: CreateCloudMapIntegration
    Description: Private DNS namespace ID used by ECS service discovery.
    Value: !Ref CloudMapNamespace
  GoServiceDiscoveryServiceArn:
    Condition: CreateCloudMapIntegration
    Description: Registry ARN to attach to the existing ECS Go service.
    Value: !GetAtt GoServiceDiscoveryService.Arn
  GoServicePrivateDnsName:
    Condition: CreateCloudMapIntegration
    Description: Private Go service DNS name resolvable from Lambda subnets.
    Value: !Sub "go.${CloudMapNamespaceName}"
